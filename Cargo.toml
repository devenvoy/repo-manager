[package]
name = "repo-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = [
    "crates/release-desk-core",
    "crates/release-desk-application",
    "crates/release-desk-store",
    "crates/release-desk-cli",
    "crates/release-desk-git",
    "crates/release-desk-tui",
]

[dependencies]
bigcolor = "1.2.1"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
release-desk-application = { path = "crates/release-desk-application" }
release-desk-core = { path = "crates/release-desk-core" }
release-desk-git = { path = "crates/release-desk-git" }
release-desk-store = { path = "crates/release-desk-store" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = 1

