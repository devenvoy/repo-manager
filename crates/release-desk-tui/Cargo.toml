[package]
name = "release-desk-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
release-desk-application = { path = "../release-desk-application" }
release-desk-core = { path = "../release-desk-core" }
release-desk-git = { path = "../release-desk-git" }
release-desk-store = { path = "../release-desk-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "warn"
