[package]
name = "release-desk-store"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
release-desk-core = { path = "../release-desk-core" }
release-desk-application = { path = "../release-desk-application" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
