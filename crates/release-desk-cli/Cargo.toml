[package]
name = "release-desk-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
release-desk-application = { path = "../release-desk-application" }
release-desk-core = { path = "../release-desk-core" }
release-desk-git = { path = "../release-desk-git" }
release-desk-store = { path = "../release-desk-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[lints.rust]
unsafe_code = "warn"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
