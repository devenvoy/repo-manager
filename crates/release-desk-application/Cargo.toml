[package]
name = "release-desk-application"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[features]
default = []
test-support = []

[dependencies]
release-desk-core = { path = "../release-desk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "warn"
