<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4F68F8"/>
      <stop offset="100%" stop-color="#263BD7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="blur"/>
      <feOffset in="blur" dx="0" dy="44" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Drop shadow -->
  <rect x="512" y="512" width="0" height="0" filter="url(#glow)"/>

  <!-- Background squircle (macOS-style corner radius ~22.5%) -->
  <rect x="64" y="64" width="896" height="896" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Inner subtle highlight stroke -->
  <rect x="64" y="64" width="896" height="896" rx="230" ry="230" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="14"/>

  <g transform="translate(512, 512)">
    <!-- Top layered card (rhomboid) -->
    <path d="M 0 -184 L 145 -145 L 0 -106 L -145 -145 Z" fill="rgba(255,255,255,0.17)" stroke="rgba(255,255,255,0.92)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle chevron -->
    <path d="M -145 -44 L 0 -8 L 145 -44" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom chevron -->
    <path d="M -145 164 L 0 128 L 145 164" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
